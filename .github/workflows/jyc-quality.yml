name: JYC Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Run full static release QA
        run: npm run qa


      - name: Verify canonical event identifiers
        run: npm run qa:identifiers

      - name: Verify canonical sitemap
        run: npm run qa:sitemap

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          CACHE="$(grep -o "jyc-cache-v[0-9.-]*" public/sw.js | head -n1)"
          EXPECTED_CACHE="jyc-cache-v${VERSION//./-}"
          echo "package version: $VERSION"
          echo "service-worker cache: $CACHE"
          test "$CACHE" = "$EXPECTED_CACHE"
          grep -q "V$VERSION" scripts/qa-jyc-release-guard.mjs

      - name: Reject accidental Vercel preview references
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git grep -nE 'https://jyc-website-[a-z0-9]+-[a-z0-9]+\.vercel\.app' -- ':!README.md' ':!docs/**' || true)"
          test -z "$(git ls-files '*.zip')"
