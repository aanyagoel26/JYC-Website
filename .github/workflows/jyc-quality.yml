name: JYC Quality Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify release metadata is internally consistent
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          CACHE="$(grep -o "jyc-cache-v[0-9.-]*" public/sw.js | head -n1)"
          echo "package version: $VERSION"
          echo "service-worker cache: $CACHE"
          test "$CACHE" = "jyc-cache-v$VERSION"
          grep -q "V$VERSION" scripts/qa-jyc-release-guard.mjs

      - name: Verify forbidden public-scope pages stay absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RqsE "href=[\"']/projects|to=[\"']/projects" src --include='*.jsx' --include='*.js'
          ! grep -RqsE "FAQ|Frequently Asked Questions" src/main.jsx src/*.jsx
          ! grep -RqsE "Impact" src/main.jsx src/*.jsx
