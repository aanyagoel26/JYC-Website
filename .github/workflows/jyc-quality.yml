name: JYC Quality Gate

concurrency:
  group: jyc-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CANONICAL_ORIGIN: https://www.jiityouthclub128.in
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Run full static release QA
        run: npm run qa


      - name: Enforce production build media/performance budget
        run: node scripts/qa-performance.mjs


      - name: Verify canonical event identifiers
        run: npm run qa:identifiers

      - name: Verify canonical sitemap
        run: npm run qa:sitemap

      - name: Verify current release contracts
        run: |
          npm run qa:dependency-lock
          npm run qa:v64-editorial
          npm run qa:photo-intelligence
          npm run qa:seo

