name: JYC Quality Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify release metadata is internally consistent
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          CACHE="$(grep -o "jyc-cache-v[0-9.-]*" public/sw.js | head -n1)"
          echo "package version: $VERSION"
          echo "service-worker cache: $CACHE"
          test "$CACHE" = "jyc-cache-v$VERSION"
          grep -q "V$VERSION" scripts/qa-jyc-release-guard.mjs

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files '*.zip')"
          test -z "$(git grep -n 'jyc-website-.*\.vercel\.app' -- ':!README.md' ':!docs/**' || true)"
