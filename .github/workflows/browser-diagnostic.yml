name: JYC Browser Diagnostic
on:
  push:
    branches: [browser-diagnostic-5613]
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        title:
          - "public app mounts with no runtime errors"
          - "route /"
          - "route /about"
          - "route /history"
          - "route /clubs"
          - "route /events"
          - "route /gallery"
          - "route /team"
          - "route /calendar"
          - "route /archive"
          - "route /recruitment"
          - "route /contact"
          - "route /fests"
          - "route /updates"
          - "route /announcements"
          - "JYC Now page stays within responsive guardrails"
          - "homepage accessibility and responsive guardrails"
          - "retired student-platform routes resolve to safe public destinations"
          - "JYC calendar contains only event content"
          - "reduced-motion mode disables hero animation"
          - "brand text contrast stays readable in both themes"
          - "mobile visual guardrails keep core content centered and inside viewport"
          - "photo-led pages render real image content"
          - "legacy redirects and unknown routes resolve safely"
          - "production shell exposes required security headers when run against a deployment"
          - "keyboard can reach the skip link and primary navigation"
    name: Test ${{ matrix.title }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test scripts/browser-smoke.spec.js --grep "${{ matrix.title }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-diagnostic-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
