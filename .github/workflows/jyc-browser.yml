name: JYC Browser QA

concurrency:
  group: jyc-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        env:
          VITE_JYC_QA_FIXTURES: 'true'
        run: npm run build

      - name: Run browser smoke and responsive QA against production preview
        env:
          JYC_UPDATE_VISUAL_BASELINES: ${{ contains(github.event.head_commit.message || '', '[visual-baseline-bootstrap]') && 'true' || 'false' }}
        run: npm run qa:browser
      - name: Upload Playwright reports and visual route captures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jyc-playwright-and-visual-report
          path: |
            playwright-report
            test-results
            scripts/visual-route-matrix.spec.js-snapshots
          if-no-files-found: ignore
      - name: Commit one-time initial visual baselines
        if: success() && contains(github.event.head_commit.message || '', '[visual-baseline-bootstrap]')
        shell: bash
        run: |
          set -euo pipefail
          test -d scripts/visual-route-matrix.spec.js-snapshots
          test -n "$(git status --porcelain -- scripts/visual-route-matrix.spec.js-snapshots)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/visual-route-matrix.spec.js-snapshots
          git commit -m "test(visual): establish initial JYC route screenshot baselines"
          git push origin HEAD:main
