name: Bug report
description: Report a reproducible JYC website problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page / route
      placeholder: "/events/example"
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open... 2. Click..."
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations: {required: true}
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / console error
    validations: {required: true}
  - type: input
    id: browser
    attributes:
      label: Browser / device
